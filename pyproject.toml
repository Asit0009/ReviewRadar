[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewpulse"
version = "0.2.0"
description = "ReviewPulse: Real Data Science, NLP & Retrieval Engine for Amazon Reviews 2023"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.25.0,<2.5.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "scikit-learn>=1.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "httpx>=0.27.0",
    "scipy>=1.12.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "joblib>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "realdata: uses the real processed data and trained models (skipped if missing)",
    "network: makes a real network request (skipped unless enabled)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
